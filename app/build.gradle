plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shunyan.prompter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shunyan.prompter'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '1.4.0'
        testInstrumentationRunner 'com.shunyan.prompter.ReplayInstrumentation'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig.ndk.abiFilters.addAll(['arm64-v8a', 'armeabi-v7a', 'x86_64'])

    androidResources {
        noCompress += ['onnx']
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.12.20.aar')
    implementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.20') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
}
